name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, tipos, tests y build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          # Valores ficticios solo para compilar (sin base de datos ni Discord).
          BETTER_AUTH_SECRET: ci-build-only-not-a-real-secret-0000000000
          BETTER_AUTH_URL: http://localhost:3100
          DISCORD_CLIENT_ID: ci-build-only
          DISCORD_CLIENT_SECRET: ci-build-only
